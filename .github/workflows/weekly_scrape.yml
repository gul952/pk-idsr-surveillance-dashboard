name: Weekly IDSR bulletin scrape

on:
  schedule:
    # Bulletins publish every Tuesday (confirmed on phb.nih.org.pk/faq).
    # Run Wednesday 08:00 UTC (~13:00 PKT) to give NIH a full day's buffer.
    - cron: '0 8 * * 3'
  workflow_dispatch: {}   # manual trigger, e.g. for the first-ever run

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run incremental scrape
        working-directory: parser
        run: python scrape_new_bulletins.py ../data/processed

      - name: Commit and push if anything changed
        run: |
          git config user.name "IDSR Dashboard Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/processed/
          if git diff --staged --quiet; then
            echo "No new data this run."
          else
            git commit -m "Automated weekly update: $(date -u +%Y-%m-%d)"
            git push
          fi
